<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moveset Index</title>
  <!-- Shared appearance: edit index.css. Character discovery: index.js. -->
  <link rel="stylesheet" href="index.css?v=2">
  <script src="index.js?v=2" defer></script>
</head>
<body>
  <main class="shell">
    <section class="intro">
      <h1>Moveset Index</h1>
      <p>Character concepts, movesets, and designer notes. Choose a character to open their sheet.</p>
    </section>

    <!-- Cards are read from each character’s index.html, including its cover and stats. -->
    <div id="game-list" aria-live="polite">
      <div class="empty-state">Loading movesets...</div>
    </div>
  </main>

  <noscript>Enable JavaScript to load the character list.</noscript>
</body>
</html>
